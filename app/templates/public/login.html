{% extends "base.html" %}
{% block title %}Logga in – {{ S.business_name }}{% endblock %}
{% block body %}
<main class="auth">
  <form method="post" class="card">
    <a class="brand" href="{{ url_for('book') }}"><span class="brand-mark">{{ icon('wrench') }}</span><span>{{ S.business_name }}<small>Logga in</small></span></a>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="flash error">{{ icon('alert') }}<span>{{ error }}</span></div>{% endif %}
    <label for="u">Användarnamn</label><input id="u" type="text" name="username" autocomplete="username" required autofocus>
    <label for="p">Lösenord</label><input id="p" type="password" name="password" autocomplete="current-password" required>
    <p class="mt mb0"><button class="block lg">Logga in</button></p>
  </form>
</main>
{% endblock %}
