{% extends "base.html" %}
{% block title %}Kunder{% endblock %}
{% block content %}
<div class="spread"><h1>Kunder</h1><a class="btn" href="{{ url_for('wo_new') }}">+ Ny arbetsorder</a></div>
<form class="card row" method="get"><input type="search" name="q" value="{{ search }}" placeholder="Sök namn, e-post, telefon…"><button>Sök</button></form>
<div class="card table-wrap"><table>
  <tr><th>Namn</th><th>E-post</th><th>Telefon</th><th class="right">Ärenden</th></tr>
  {% for c in rows %}
  <tr><td><a href="{{ url_for('customer_detail', cid=c.id) }}">{{ c.name }}</a></td><td>{{ c.email or '' }}</td><td>{{ c.phone or '' }}</td><td class="right">{{ c.wo_count }}</td></tr>
  {% else %}<tr><td colspan="4" class="muted">Inga kunder.</td></tr>{% endfor %}
</table></div>
{% endblock %}
