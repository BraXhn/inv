<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="{% block robots %}noindex{% endblock %}">
<meta name="theme-color" content="{{ S.accent_color or '#1f6f5c' }}">
<title>{% block title %}{{ S.business_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ VERSION }}">
<link rel="stylesheet" href="{{ url_for('theme_css') }}?v={{ (S.accent_color or '')|replace('#', '') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block body %}
<main class="pub">
  {% for cat, m in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }} no-print">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}?v={{ VERSION }}"></script>
</body>
</html>
